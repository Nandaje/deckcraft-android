org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
android.useAndroidX=false
android.nonTransitiveRClass=true
# ABIs the Rust library is built for (comma-separated Android ABI names). arm64-v8a covers
# practically every phone and tablet from the last decade; x86_64 is for the emulator.
deckcraft.abis=arm64-v8a,x86_64
